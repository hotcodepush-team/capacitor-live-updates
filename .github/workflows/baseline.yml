name: Baseline

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: 21

jobs:
  size:
    name: Guard the binary size against the baseline
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: plugin
      - name: Read the pinned demo commit
        id: baseline
        run: echo "demo=$(node -p "require('./plugin/benchmarks/baseline.json').demo.commit")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: hotcodepush-team/capacitor-live-updates-demo
          ref: ${{ steps.baseline.outputs.demo }}
          path: demo
      - uses: actions/setup-node@v6
        with:
          node-version-file: plugin/.nvmrc
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - name: Pack the plugin from this pull request
        working-directory: plugin
        run: npm ci && npm run build && npm pack --pack-destination "$RUNNER_TEMP"
      - name: Prepare the demo with the plugin
        run: node plugin/benchmarks/prepare-demo.mjs demo "$RUNNER_TEMP/with" with "$(ls "$RUNNER_TEMP"/hotcodepush-capacitor-live-updates-*.tgz)"
      - name: Measure the sizes and compare them with the baseline
        run: node plugin/benchmarks/measure-size.mjs "$RUNNER_TEMP/with" > "$RUNNER_TEMP/sizes.json" && node plugin/benchmarks/guard-size.mjs plugin/benchmarks/baseline.json "$RUNNER_TEMP/sizes.json" >> "$GITHUB_STEP_SUMMARY"
